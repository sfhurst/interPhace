<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>interPhace – hurst.audio</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="app">
      <!-- HEADER / BRANDING -->
      <header class="instrument-header">
        <div class="instrument-left">interPhace</div>
        <button id="play" class="play-btn">Audition</button>
        <div class="instrument-right">hurst.audio</div>
      </header>

      <!-- PITCH -->
      <section class="panel" data-section="pitch">
        <button class="panel-header">Pitch</button>
        <div class="panel-body" id="pitchSection">
          <div class="control">
            <div class="control-top">
              <label class="control-label">Root Note</label>
              <span class="control-value" id="rootNoteValue">C4 (60)</span>
            </div>
            <div class="control-body">
              <input id="rootNote" type="range" min="21" max="108" value="60" />
            </div>
          </div>
        </div>
      </section>

      <!-- ENVELOPE (PRIMARY) -->
      <section class="panel" data-section="envPrimary">
        <button class="panel-header">Envelope (Primary)</button>
        <div class="panel-body" id="envPrimarySection">
          <div class="control">
            <div class="control-top">
              <label class="control-label">Attack</label>
              <span class="control-value" id="attack1Value">0.02</span>
            </div>
            <div class="control-body">
              <input id="attack1" type="range" min="0" max="2" step="0.002" value="0.04" />
            </div>
          </div>

          <div class="control">
            <div class="control-top">
              <label class="control-label">Hold 1</label>
              <span class="control-value" id="hold1Value">0.05</span>
            </div>
            <div class="control-body">
              <input id="hold1" type="range" min="0" max="6" step="0.002" value="0.00" />
            </div>
          </div>

          <div class="control">
            <div class="control-top">
              <label class="control-label">Decay 1</label>
              <span class="control-value" id="decay1Value">0.4</span>
            </div>
            <div class="control-body">
              <input id="decay1" type="range" min="0" max="2" step="0.002" value="0.80" />
            </div>
          </div>

          <div class="control">
            <div class="control-top">
              <label class="control-label">Decay 1 Target (%)</label>
              <span class="control-value" id="decay1TargetValue">70%</span>
            </div>
            <div class="control-body">
              <input id="decay1Target" type="range" min="0" max="100" value="10" />
            </div>
          </div>

          <div class="control">
            <div class="control-top">
              <label class="control-label">Hold 2</label>
              <span class="control-value" id="hold2Value">0.15</span>
            </div>
            <div class="control-body">
              <input id="hold2" type="range" min="0" max="6" step="0.002" value="1.5" />
            </div>
          </div>

          <div class="control">
            <div class="control-top">
              <label class="control-label">Decay 2</label>
              <span class="control-value" id="decay2Value">1.0</span>
            </div>
            <div class="control-body">
              <input id="decay2" type="range" min="0" max="2" step="0.002" value="0.9" />
            </div>
          </div>

          <div class="control">
            <div class="control-top">
              <label class="control-label">Time Multiplier</label>
              <span class="control-value" id="envMultValue">100%</span>
            </div>
            <div class="control-body">
              <input id="envMult" type="range" min="0.25" max="10" step="0.25" value="1.00" />
            </div>
          </div>

          <div class="divider"></div>

          <div class="preset-row">
            <button class="preset-btn" data-env="blip">Blip</button>
            <button class="preset-btn active" data-env="piano">Piano</button>
            <button class="preset-btn" data-env="pad">Pad</button>
            <button class="preset-btn" data-env="drone">Drone</button>
          </div>
        </div>
      </section>

      <!-- ENGINE -->
      <section class="panel" data-section="engine">
        <button class="panel-header">Engine</button>
        <div class="panel-body" id="engineSection">
          <div class="engine-select">
            <button class="engine-btn active" data-engine="fm">FM Synth</button>
            <button class="engine-btn" data-engine="sub">Subtractive</button>
            <button class="engine-btn" data-engine="sampler">Sampler</button>
          </div>

          <div class="divider"></div>

          <div class="engine-panel active" id="engine-fm">
            <div class="control">
              <div class="control-top">
                <label class="control-label">Detune</label>
                <span class="control-value" id="detuneAmountValue">0%</span>
              </div>
              <div class="control-body">
                <input id="detuneAmount" type="range" min="0" max="100" step="1" value="0" />
              </div>
            </div>

            <div class="divider"></div>

            <!-- MODULATOR 1 -->
            <div class="mod-block">
              <h3 class="mod-title">Modulator 1</h3>

              <div class="control">
                <div class="control-top">
                  <label class="control-label">Gain</label>
                  <span class="control-value" id="mod1GainValue">0%</span>
                </div>
                <div class="control-body">
                  <input id="mod1Gain" type="range" min="0" max="100" value="0" />
                </div>
              </div>

              <div class="control">
                <span class="control-label">Ratio</span>
              </div>
              <div class="ratio-row" data-mod="1">
                <button class="ratio-btn" data-ratio="0.25">0.25x</button>
                <button class="ratio-btn active" data-ratio="0.5">0.5x</button>
                <button class="ratio-btn" data-ratio="0.75">0.75x</button>
                <button class="ratio-btn" data-ratio="1">1</button>
                <button class="ratio-btn" data-ratio="1.5">1.5</button>
                <button class="ratio-btn" data-ratio="2">2</button>
              </div>

              <div class="control">
                <span class="control-label">Wave</span>
              </div>
              <div class="wave-row" data-mod="1">
                <button class="ratio-btn active" data-wave="sine">Sine</button>
                <button class="ratio-btn" data-wave="square">Square</button>
                <button class="ratio-btn" data-wave="saw">Saw</button>
              </div>
            </div>

            <div class="divider"></div>

            <!-- MODULATOR 2 -->
            <div class="mod-block">
              <h3 class="mod-title">Modulator 2</h3>

              <div class="control">
                <div class="control-top">
                  <label class="control-label">Gain</label>
                  <span class="control-value" id="mod2GainValue">0%</span>
                </div>
                <div class="control-body">
                  <input id="mod2Gain" type="range" min="0" max="100" value="0" />
                </div>
              </div>

              <div class="control">
                <span class="control-label">Ratio</span>
              </div>
              <div class="ratio-row" data-mod="2">
                <button class="ratio-btn" data-ratio="0.25">0.25x</button>
                <button class="ratio-btn active" data-ratio="0.5">0.5x</button>
                <button class="ratio-btn" data-ratio="0.75">0.75x</button>
                <button class="ratio-btn" data-ratio="1">1</button>
                <button class="ratio-btn" data-ratio="1.5">1.5</button>
                <button class="ratio-btn" data-ratio="2">2</button>
              </div>

              <div class="control">
                <span class="control-label">Wave</span>
              </div>
              <div class="wave-row" data-mod="2">
                <button class="ratio-btn active" data-wave="sine">Sine</button>
                <button class="ratio-btn" data-wave="square">Square</button>
                <button class="ratio-btn" data-wave="saw">Saw</button>
              </div>
            </div>
          </div>

          <div class="engine-panel" id="engine-sub">
            <!-- Subtractive engine UI -->
          </div>

          <div class="engine-panel" id="engine-sampler">
            <!-- Sampler engine UI -->
          </div>
        </div>
      </section>

      <!-- FILTER -->
      <section class="panel" data-section="filter">
        <button class="panel-header">Filter</button>
        <div class="panel-body" id="filterSection">
          <!-- Filter controls go here -->
        </div>
      </section>

      <!-- EFFECTS -->
      <section class="panel" data-section="effects">
        <button class="panel-header">Effects</button>
        <div class="panel-body" id="effectsSection">
          <!-- Effects controls go here -->
        </div>
      </section>

      <!-- RENDER -->
      <section class="panel" data-section="render">
        <button class="panel-header">Render</button>
        <div class="panel-body" id="renderSection">
          <div class="control">
            <div class="control-top">
              <label class="control-label">Sample Rate</label>
            </div>

            <div class="ratio-row" id="sampleRateRow">
              <button class="ratio-btn" data-sr="44100">44.1k</button>
              <button class="ratio-btn" data-sr="48000">48k</button>
              <button class="ratio-btn" data-sr="88200">88.2k</button>
              <button class="ratio-btn" data-sr="96000">96k</button>
              <button class="ratio-btn" data-sr="176400">176.4k</button>
              <button class="ratio-btn active" data-sr="192000">192k</button>
            </div>
          </div>

          <div class="control">
            <div class="control-top">
              <label class="control-label">Duration (s)</label>
              <span class="control-value" id="renderDurationValue">8.0</span>
            </div>
            <div class="control-body">
              <input id="renderDuration" type="range" min="0.1" max="30" step="0.1" value="8.0" />
            </div>
          </div>

          <button id="render" class="render-btn">Render</button>
        </div>
      </section>
    </main>

    <!-- JS -->
    <script src="js/core/state.js" defer></script>
    <script src="js/core/ui.js" defer></script>
    <script src="js/core/utils.js" defer></script>

    <script src="js/sections/music-engine.js" defer></script>
    <script src="js/sections/envelope-primary.js" defer></script>
    <script src="js/sections/engine-fm.js" defer></script>
    <script src="js/sections/filter.js" defer></script>
    <script src="js/sections/effects.js" defer></script>
    <script src="js/sections/render.js" defer></script>

    <script src="main.js" defer></script>
  </body>
</html>
