<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>interPhace</title>
    <!-- JS -->
    <script src="app.js" defer></script>
  </head>
  <body>
    <!-- ROOT NOTE -->
    <label>MIDI Note:</label>
    <input id="midiNote" type="number" value="60" />

    <!-- ENVELOPE -->
    <label>Attack:</label>
    <input id="attack" type="number" step="0.001" value="0.025" />

    <label>Hold:</label>
    <input id="hold" type="number" step="0.001" value="0.05" />

    <label>Decay:</label>
    <input id="decay" type="number" step="0.01" value="2.8" />

    <!-- UNISON -->
    <label>Voices:</label>
    <input id="voices" type="number" value="2" />

    <label>Detune Spread:</label>
    <input id="detuneSpread" type="number" step="0.1" value="3" />

    <!-- FM -->
    <label>FM Rate:</label>
    <input id="fmRate" type="number" step="0.1" value="1.2" />

    <label>FM Depth:</label>
    <input id="fmDepth" type="number" step="0.01" value="0.25" />

    <!-- FILTER -->
    <label>LP Freq:</label>
    <input id="lpFreq" type="number" value="1500" />

    <label>LP Q:</label>
    <input id="lpQ" type="number" step="0.1" value="0.4" />

    <!-- CHORUS -->
    <label>Chorus Delay:</label>
    <input id="chorusDelay" type="number" step="0.001" value="0.008" />

    <label>Chorus Rate:</label>
    <input id="chorusRate" type="number" step="0.01" value="0.22" />

    <label>Chorus Depth:</label>
    <input id="chorusDepth" type="number" step="0.0001" value="0.0012" />

    <!-- REVERB -->
    <label>Reverb Seconds:</label>
    <input id="reverbSeconds" type="number" step="0.1" value="4.5" />

    <label>Reverb LP Freq:</label>
    <input id="reverbLPFreq" type="number" value="2000" />

    <label>Reverb LP Q:</label>
    <input id="reverbLPQ" type="number" step="0.1" value="0.35" />

    <!-- MIX -->
    <label>Dry Level:</label>
    <input id="dryLevel" type="number" step="0.01" value="0.50" />

    <label>Wet Level:</label>
    <input id="wetLevel" type="number" step="0.01" value="0.75" />

    <!-- RENDER -->
    <label>Sample Rate:</label>
    <input id="sampleRate" type="number" value="192000" />

    <label>Render Duration:</label>
    <input id="renderDuration" type="number" step="0.1" value="7.0" />

    <!-- MODULATORS -->
    <h3>Mod1: Slow Drift</h3>
    Rate: <input id="mod1Rate" type="number" step="0.01" value="1.2" /><br />
    Depth: <input id="mod1Depth" type="number" step="0.01" value="0.25" /><br />

    <h3>Mod2: Wow</h3>
    Rate: <input id="mod2Rate" type="number" step="0.01" value="0.4" /><br />
    Depth: <input id="mod2Depth" type="number" step="0.01" value="0.15" /><br />

    <h3>Mod3: Flutter</h3>
    Rate: <input id="mod3Rate" type="number" step="0.01" value="3.5" /><br />
    Depth: <input id="mod3Depth" type="number" step="0.01" value="0.05" /><br />

    <br /><br />
    <button id="play">Play</button>
  </body>
</html>
